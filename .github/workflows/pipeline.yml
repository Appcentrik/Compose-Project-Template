name: Android CI

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ "master", "develop" ]
    types: [ opened, synchronize, reopened, ready_for_review, edited ]

jobs:
  ci:
    if: ${{ github.event.pull_request.draft == false && !contains(github.event.pull_request.title, 'wip') && (github.event.action != 'edited' || github.event.changes.title != null) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Read config
        id: config
        run: |
          for key in build lint verify tests; do
            val=$(jq -r ".$key" .github/ci-config.json)
            echo "$key=$val" >> $GITHUB_OUTPUT
          done

      - name: Setup Gradle + JDK
        id: setup
        if: steps.config.outputs.build == 'true' || steps.config.outputs.lint == 'true' || steps.config.outputs.verify == 'true' || steps.config.outputs.tests == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission
        id: chmod
        if: steps.config.outputs.build == 'true' || steps.config.outputs.lint == 'true' || steps.config.outputs.verify == 'true' || steps.config.outputs.tests == 'true'
        run: chmod +x gradlew

      - name: Lint (ktlint)
        id: lint
        if: steps.config.outputs.lint == 'true'
        run: ./gradlew ktlintCheck --parallel --build-cache

      - name: Verify resources
        id: verify
        if: steps.config.outputs.verify == 'true'
        run: ./gradlew verifyResources --parallel --build-cache

      - name: Build
        id: build
        if: steps.config.outputs.build == 'true'
        run: ./gradlew assemble --parallel --build-cache

      - name: Tests
        id: tests
        if: steps.config.outputs.tests == 'true'
        run: ./gradlew test --parallel --build-cache

      - name: Upload test reports
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/test-results/
            build/reports/
          retention-days: 7

      - name: Notify Discord
        if: always()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_CI }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${{ job.status }}" = "success" ]; then
            EMOJI="✅"; COLOR=3066993
          elif [ "${{ job.status }}" = "cancelled" ]; then
            EMOJI="🛑"; COLOR=9807270
          else
            EMOJI="❌"; COLOR=15158332
          fi
          TITLE="$PR_TITLE"
          if [ -z "$TITLE" ]; then
            TITLE="$COMMIT_MSG"
          fi
          TITLE="${TITLE%%$'\n'*}"
          [ -z "$TITLE" ] && TITLE="${{ github.ref_name }}"
          TITLE="${TITLE:0:250}"
          FAILED=""
          [ "${{ steps.lint.outcome }}" = "failure" ] && FAILED="${FAILED}Lint, "
          [ "${{ steps.verify.outcome }}" = "failure" ] && FAILED="${FAILED}Verify, "
          [ "${{ steps.build.outcome }}" = "failure" ] && FAILED="${FAILED}Build, "
          [ "${{ steps.tests.outcome }}" = "failure" ] && FAILED="${FAILED}Tests, "
          FAILED="${FAILED%, }"
          BRANCH="${{ github.head_ref }}"
          [ -z "$BRANCH" ] && BRANCH="${{ github.ref_name }}"
          if [ "${{ job.status }}" = "cancelled" ]; then
            RUNS=$(curl -s -G -H "Authorization: Bearer $GITHUB_TOKEN" \
              --data-urlencode "branch=$BRANCH" \
              --data "per_page=30" \
              "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs")
            LATEST=$(echo "$RUNS" | jq -r --arg wf "${{ github.workflow }}" '([.workflow_runs[] | select(.name == $wf) | .id] | max) // 0' 2>/dev/null)
            [[ "$LATEST" =~ ^[0-9]+$ ]] || LATEST=0
            if [ "$LATEST" -gt "${{ github.run_id }}" ]; then
              echo "Cancelled by a newer run ($LATEST); skipping notification."
              exit 0
            fi
            DESC="Pipeline cancelled"
          elif [ "${{ job.status }}" = "success" ]; then
            DESC="Pipeline success"
          elif [ -n "$FAILED" ]; then
            DESC="Pipeline failed on: $FAILED"
          else
            DESC="Pipeline failed"
          fi
          BRANCH_URL="${{ github.server_url }}/${{ github.repository }}/tree/$BRANCH"
          if [ -n "$PR_URL" ]; then
            DESC="$DESC · [Ver PR]($PR_URL)"
            EMBED_URL="$PR_URL"
          else
            DESC="$DESC · [Ver rama]($BRANCH_URL)"
            EMBED_URL="$BRANCH_URL"
          fi
          DESC="$DESC · [Ver run]($RUN_URL)"
          PAYLOAD=$(jq -n \
            --arg title "$EMOJI $TITLE" \
            --arg url "$EMBED_URL" \
            --arg desc "$DESC" \
            --arg footer "${{ github.ref_name }} · ${GITHUB_SHA:0:7}" \
            --argjson color "$COLOR" \
            '{embeds:[{title:$title,description:$desc,url:$url,color:$color,footer:{text:$footer}}]}')
          curl -s -H "Content-Type: application/json" -X POST "$WEBHOOK" -d "$PAYLOAD"